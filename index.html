
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Quiz Application</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <!-- Welcome Screen -->
        <div id="welcome-screen">
            <h1>Knowledge Quiz</h1>

            <p>Test your general knowledge and see
            how much you know!</p>

            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hide">

            <div class="quiz-header">
                <h2>General Knowledge Quiz</h2>
                <p id="question-number"></p>
                <p id="score">Score: 0</p>
            </div>

            <h3 id="question">Question goes here</h3>

            <div id="answer-buttons">
                <!-- Answer buttons will be added using JavaScript -->
            </div>

            <p id="feedback"></p>

            <button id="next-btn" class="hide">
                Next Question
            </button>

        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hide">

            <h2>Quiz Completed!</h2>

            <p id="final-score"></p>

            <button id="restart-btn">Restart Quiz</button>

        </div>

    </div>

    <!-- Link JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
